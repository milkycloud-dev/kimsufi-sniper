name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  TITLE: Kimsufi Sniper

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyflakes

      - name: Lint
        run: python -m pyflakes $(git ls-files '*.py')

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Docker image
        run: docker build -t kimsufi-sniper:ci .

      - name: Source package
        run: |
          name="kimsufi-sniper-${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: kimsufi-sniper-*.tar.gz*
          if-no-files-found: error

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '/^## / {p = ($2 == v); next} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $GITHUB_REF_NAME" > notes.md
          cat notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.TITLE }} ${{ github.ref_name }}
          body_path: notes.md
          files: kimsufi-sniper-*.tar.gz*
          fail_on_unmatched_files: true
